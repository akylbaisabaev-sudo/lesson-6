<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Интерактивный калькулятор</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 400px;
        margin: 40px auto;
        padding: 0 16px;
      }

      input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        margin-bottom: 10px;
        font-size: 16px;
      }

      .buttons {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }

      .operation-btn {
        flex: 1;
        padding: 12px;
        font-size: 20px;
        cursor: pointer;
      }

      #result {
        font-size: 20px;
        min-height: 28px;
      }
    </style>
  </head>
  <body>
    <h1>Калькулятор</h1>
    <input type="number" id="num1" placeholder="Первое число" />
    <input type="number" id="num2" placeholder="Второе число" />
    <div class="buttons">
      <button class="operation-btn" data-operation="+">+</button>
      <button class="operation-btn" data-operation="-">-</button>
      <button class="operation-btn" data-operation="*">×</button>
      <button class="operation-btn" data-operation="/">÷</button>
    </div>
    <div id="result"></div>
    <script src="functions.js"></script>
    <script src="calculator.js"></script>
  </body>
</html>
